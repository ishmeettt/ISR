server {
    listen 80;

    location /api/ {
        # The backend owns a static IP on the compose network (see
        # docker-compose.yml), so nginx needs no DNS: restarting the backend
        # keeps its address and cannot produce stale-record 502s.
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
